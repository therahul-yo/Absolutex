# Absolutex CI.
#
# Device-free by construction: everything here runs on a GitHub-hosted x86_64 Linux runner
# with no emulator and no attached hardware. The instrumented tests (:source:libarchive) and
# the startup Macrobenchmark are NOT run here — they need the reference device and are run
# by hand. See .github/workflows/README.md.
#
# Action versions were resolved against the live repositories on 2026-09-14, not from memory.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on pull requests, never on main. A push to main that cancels the
  # previous commit's run leaves that commit with no verdict at all — which already happened
  # once: the integration merge was cancelled mid-run by the very next push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Pinned in gradle/libs.versions.toml; duplicated here because sdkmanager runs before
  # Gradle can tell us. Keep in sync with the `ndk` and cmake entries there.
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "4.1.2"
  COMPILE_SDK: "37"

jobs:
  # Seconds, no SDK, no Gradle. Three branches have reached CI this week with merge
  # markers committed, or built on a base so old the merge would have deleted whole
  # modules. Both are invisible to a green local gate: a branch missing four modules
  # compiles perfectly. This job is the cheapest place to catch them.
  hygiene:
    name: Branch hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Not line-anchored for the angle-bracket markers: a marker left inside a KDoc begins
      # with " * ", compiles fine, and sailed straight past the anchored pattern — a green
      # gate that proved nothing. "=======" stays anchored, because "===" rules are ordinary
      # prose in the vendored licence texts.
      - name: No conflict markers
        run: |
          if git grep -nE '(^|[[:space:]]|\*[[:space:]])(<<<<<<<|>>>>>>>)[[:space:]]' \
               -- ':!*.md' ':!.github/workflows/ci.yml' ||
             git grep -nE '^======= *$' -- ':!*.md' ':!.github/workflows/ci.yml' ':!**/licenses/**'; then
            echo "::error::conflict markers are committed — resolve them before pushing"
            exit 1
          fi

      # A pull request that removes an include() from settings.gradle.kts is either
      # deliberate (say so in the title) or the signature of a stale base. The title and
      # base ref go through env, never through ${{ }} inside the script: an expression
      # interpolated into a shell line lets a PR title run commands on the runner.
      # Rejects a NEW hardcoded user-visible string. Known ones are pinned in
      # tools/strings-baseline.json and reviewed as a diff, the same way the APK
      # size baseline works — the gate is green on main and red on anything new.
      - name: No new hardcoded strings
        run: python3 tools/check-strings.py

      # Placeholders, CLDR plural forms and stale keys in every values-<tag>/strings.xml.
      # A missing translation is not a failure — Android falls back per resource — but a
      # translation that drops a %2$s or a plural form its language needs is a crash or a
      # wrong sentence on a device nobody here tests on.
      - name: Translations are well-formed
        run: python3 tools/check-translations.py

      # Room writes schemas/<db>/<version>.json at compile time and DatabaseSchemaTest reads
      # them back, both inside the same build — so the test passes on a schema the compiler
      # wrote seconds earlier whether or not it is committed. Version 6 merged with 6.json
      # absent from the branch and every check green. An exported schema that regenerates on
      # every build records nothing: edit the entity later and it is rewritten in place, and
      # the migration into it is validated against what the entity says now rather than what
      # shipped. No test inside the build can catch this, because the build creates the file.
      - name: Exported Room schemas are committed
        run: python3 tools/check-schemas.py

      - name: No module dropped by accident
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          dropped=$(git diff "origin/$BASE_REF...HEAD" -- settings.gradle.kts | grep -E '^-include' || true)
          if [ -n "$dropped" ]; then
            echo "::error::this branch removes modules from settings.gradle.kts:"
            echo "$dropped"
            if [[ "$PR_TITLE" == *"drops module"* ]]; then
              echo "declared in the title — allowed"
            else
              echo "If that is deliberate, put 'drops module' in the PR title."
              exit 1
            fi
          fi

  # Pure Python, no SDK, no Gradle. Runs in seconds and is the fastest signal that a
  # refactor changed the hostile corpus (spec §8).
  corpus:
    name: Test corpus is reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      # --include-huge is deliberately omitted: the 2.25 GiB case would dominate the job
      # for no signal, and it is excluded from the pinned digests anyway.
      - name: Generate and verify
        run: python3 tools/make-corpus.py --out "$RUNNER_TEMP/corpus" --check

      - name: Corpus manifest
        if: always()
        run: |
          {
            echo '### Corpus manifest'
            echo '```json'
            cat "$RUNNER_TEMP/corpus/corpus-manifest.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Build, analyse and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Needed only by the SARIF upload. Pull requests from forks do not get it, which is
      # why that step is continue-on-error rather than a gate.
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          # JDK 21 everywhere. Every module sets jvmToolchain(21); introducing a second JDK
          # here only creates a way for CI and local builds to disagree.
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6.3.0

      # Best effort, one package at a time.
      #
      # This step used to install all three in one sdkmanager call under `set -e`. That is
      # wrong twice over: `platforms;android-37` is not in the public SDK repository yet, so
      # sdkmanager exits 1 and took the whole step — and with it the first Gradle step — down
      # with it. And it was never load-bearing: run 34867170061 built libarchive for
      # arm64-v8a, resolved compileSdk 37 and produced a release APK with this step having
      # installed nothing at all, because AGP downloads what it needs on its own.
      #
      # So: pre-warm what the public repo has, report what it does not, and let Gradle be the
      # judge. A component that is genuinely missing surfaces as a Gradle error naming it,
      # which is far more useful than sdkmanager's "Failed to find package".
      - name: Install SDK components
        run: |
          set -uo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes 2>/dev/null | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          for pkg in "platforms;android-${COMPILE_SDK}" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"; do
            if "$SDKMANAGER" "$pkg" > /dev/null 2>&1; then
              echo "installed    $pkg"
            else
              echo "unavailable  $pkg - continuing; AGP resolves it if the build needs it"
            fi
          done
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # --continue so one failing check does not hide the others: a reviewer gets the whole
      # picture from a single run instead of peeling them off one at a time.
      # `if:` matters here as much as on the steps below. Without it a failing setup step
      # skips detekt silently, and a skipped detekt emits nothing — the only trace is a
      # missing SARIF file three steps later. That is exactly how run 34867170061 hid it.
      - name: detekt
        if: success() || failure()
        run: ./gradlew --continue detekt

      - name: Android Lint
        if: success() || failure()
        run: ./gradlew --continue lintRelease

      # Both task names on purpose. :core:model and :source:api are kotlin-jvm modules whose
      # unit tests live under `test`; the Android modules use `testDebugUnitTest`. Running
      # only the latter would silently skip NaturalOrderTest and friends.
      - name: Unit tests
        if: success() || failure()
        run: ./gradlew --continue test testDebugUnitTest

      - name: Assemble release
        if: success() || failure()
        run: ./gradlew :app:assembleRelease

      # Nothing depends on :source:pdf yet, so no other task in this job reaches its native
      # build: unit tests and lint compile its Kotlin, but externalNativeBuild is wired to
      # assemble, not to them. Without this step CMake never runs for that module — the pinned
      # PDFium download and its SHA256 check, the JNI compile, and the POST_BUILD staging of
      # libpdfium.so are all unverified, and the module ships on Kotlin unit tests alone.
      # Delete this step once :app depends on :source:pdf; assembleRelease covers it then.
      - name: Assemble :source:pdf (native)
        if: success() || failure()
        run: ./gradlew :source:pdf:assembleDebug

      - name: APK size report
        if: success() || failure()
        run: |
          python3 tools/check-apk-size.py \
            --apk app/build/outputs/apk/release \
            --baseline .github/apk-size-baseline.json \
            --summary "$GITHUB_STEP_SUMMARY"

      # detekt emits SARIF specifically so findings land on the PR diff as annotations
      # rather than only in a log nobody opens.
      - name: Upload detekt SARIF
        if: (success() || failure()) && hashFiles('build/reports/detekt/detekt.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4.38.0
        continue-on-error: true
        with:
          sarif_file: build/reports/detekt/detekt.sarif
          category: detekt

      - name: Upload reports
        if: success() || failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reports
          if-no-files-found: ignore
          path: |
            build/reports/detekt/**
            **/build/reports/lint-results-*.html
            **/build/reports/tests/**
            **/build/test-results/**/*.xml

      - name: Upload release APK and mapping
        if: success() || failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-apk
          if-no-files-found: ignore
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
