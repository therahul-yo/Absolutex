# Absolutex version catalog.
# Every version here was resolved against the live repository, not from memory.
# Re-verify with: ./gradlew dependencyUpdates  (or the maven-metadata query in the README)

[versions]
agp                  = "9.4.0"          # Sept 2026, latest stable
kotlin               = "2.4.20"
# Phase 4 verification (2026-09-15, Maven Central + KSP GitHub releases): 2.3.12 is the
# newest KSP published and no 2.4.x KSP line exists yet, so there is nothing newer to
# upgrade to for Kotlin 2.4.20. Kept deliberately; re-check with:
#   curl -s https://repo1.maven.org/maven2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/maven-metadata.xml
# KSP/Room/Hilt wiring is proved by ./gradlew :core:data:kspDebugKotlin (see phase-4 PR).
ksp                  = "2.3.12"         # KSP moved to independent versioning; no longer <kotlin>-<ksp>
composeBom           = "2026.08.00"     # Compose 1.12
hilt                 = "2.60.1"
androidxHilt         = "1.4.0"
room                 = "2.8.5"
datastore            = "1.2.1"
activityCompose      = "1.13.0"
lifecycle            = "2.11.0"
navigation           = "2.10.1"
coreKtx              = "1.18.0"
coreSplashscreen     = "1.2.0"
adaptive             = "1.4.0"
benchmark            = "1.5.0"
profileinstaller     = "1.4.1"
junit                = "4.13.2"
androidxTestExt      = "1.3.0"
androidxTestRunner   = "1.7.0"
uiautomator          = "2.4.0"
# Robolectric runs Room on the JVM, so DAO and migration tests need no device. Test-only.
robolectric          = "4.17"
androidxTestCore     = "1.7.0"
coroutines           = "1.10.2"
# detekt: the 2.x line under the new `dev.detekt` coordinates. Resolved 2026-09-14 against
# plugins.gradle.org, not from memory. The last 1.x (io.gitlab.arturbosch.detekt 1.23.8,
# Feb 2025) was published by Gradle 8.12.1 and predates the Gradle 9 API removals; 2.0.0-alpha.6
# was published by Gradle 9.6.1 and declares configuration-cache support. It is an alpha,
# and that is the tradeoff: it is the only detekt built for the toolchain this repo is on.
detekt               = "2.0.0-alpha.6"
# commons-net: verified 2026-09-15 against live Maven Central, not from memory.
# Version: maven-metadata.xml reports <latest>3.13.0</latest>/<release>3.13.0</release>.
# Licence: Apache-2.0 — declared by the Central POM's Apache header plus its parent chain
# (commons-parent:97 -> apache:37, which carries the Apache License 2.0 grant).
# Re-check with:
#   curl -s https://repo1.maven.org/maven2/commons-net/commons-net/maven-metadata.xml
commonsNet           = "3.13.0"
# ftpserver-core: test-only, an in-process real FTP server to pin CommonsNetFtpTransport's wire
# behaviour (a fake FTPClient can't reproduce a genuine 426 reply). Verified 2026-09-15:
#   curl -s https://repo1.maven.org/maven2/org/apache/ftpserver/ftpserver-core/maven-metadata.xml
# reports <latest>1.2.1</latest>/<release>1.2.1</release>. Chosen over org.mockftpserver:
# MockFtpServer 3.2.0, which was tried first and fails differently from a real server — its
# FakeFtpServer throws on the data socket's early close and drops the control connection
# (FTPConnectionClosedException on the client), instead of answering with 426/450/451 the way
# pyftpdlib/vsftpd/ProFTPD do. ftpserver-core reproduces the real reply (confirmed with a spike:
# completePendingCommand=false, reply=426, control connection still usable) — unsurprising, since
# commons-net's own test suite depends on this same library (its POM, same groupId/version) to
# test its FTP client. Transitive versions (also test-only, resolved from ftpserver-core 1.2.1's
# own POM, not guessed): ftplet-api 1.2.1 (same release), mina-core 2.2.4, slf4j-api 1.7.36.
ftpserverCore        = "1.2.1"
minaCore             = "2.2.4"
slf4jApiFtpTest      = "1.7.36"
# mockwebserver3: test-only, a real in-process HTTP server so sync wiring tests speak the
# actual Komga/Kavita endpoints (a fake HttpCall can't reproduce a genuine 401/5xx or a
# truncated chunked body). Verified 2026-09-16:
#   curl -s https://repo1.maven.org/maven2/com/squareup/okhttp3/mockwebserver3/maven-metadata.xml
# reports <latest>5.5.0</latest>/<release>5.5.0</release>. Apache-2.0 (Square).
# Test classpath only — confirm with apkanalyzer that okhttp/okio never enter the release APK.
mockwebserver3       = "5.5.0"

# SDK levels — see plan §2. minSdk 33 is the AGSL floor; costs ~0% inside our hardware class.
compileSdk           = "37"
targetSdk            = "36"             # 37 removes the orientation-lock opt-out; deadline Aug 2027
minSdk               = "33"
ndk                  = "28.2.13676358"  # AGP 9.4.0's own default

[libraries]
