# Absolutex version catalog.
# Every version here was resolved against the live repository, not from memory.
# Re-verify with: ./gradlew dependencyUpdates  (or the maven-metadata query in the README)

[versions]
agp                  = "9.4.0"          # Sept 2026, latest stable
kotlin               = "2.4.20"
# Phase 4 verification (2026-09-15, Maven Central + KSP GitHub releases): 2.3.12 is the
# newest KSP published and no 2.4.x KSP line exists yet, so there is nothing newer to
# upgrade to for Kotlin 2.4.20. Kept deliberately; re-check with:
#   curl -s https://repo1.maven.org/maven2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/maven-metadata.xml
# KSP/Room/Hilt wiring is proved by ./gradlew :core:data:kspDebugKotlin (see phase-4 PR).
ksp                  = "2.3.12"         # KSP moved to independent versioning; no longer <kotlin>-<ksp>
composeBom           = "2026.08.00"     # Compose 1.12
hilt                 = "2.60.1"
androidxHilt         = "1.4.0"
room                 = "2.8.5"
datastore            = "1.2.1"
activityCompose      = "1.13.0"
lifecycle            = "2.11.0"
navigation           = "2.10.1"
coreKtx              = "1.18.0"
coreSplashscreen     = "1.2.0"
adaptive             = "1.4.0"
benchmark            = "1.5.0"
profileinstaller     = "1.4.1"
junit                = "4.13.2"
androidxTestExt      = "1.3.0"
androidxTestRunner   = "1.7.0"
uiautomator          = "2.4.0"
coroutines           = "1.10.2"
# detekt: the 2.x line under the new `dev.detekt` coordinates. Resolved 2026-09-14 against
# plugins.gradle.org, not from memory. The last 1.x (io.gitlab.arturbosch.detekt 1.23.8,
# Feb 2025) was published by Gradle 8.12.1 and predates the Gradle 9 API removals; 2.0.0-alpha.6
# was published by Gradle 9.6.1 and declares configuration-cache support. It is an alpha,
# and that is the tradeoff: it is the only detekt built for the toolchain this repo is on.
detekt               = "2.0.0-alpha.6"

# SDK levels — see plan §2. minSdk 33 is the AGSL floor; costs ~0% inside our hardware class.
compileSdk           = "37"
targetSdk            = "36"             # 37 removes the orientation-lock opt-out; deadline Aug 2027
minSdk               = "33"
ndk                  = "28.2.13676358"  # AGP 9.4.0's own default

[libraries]
androidx-core-ktx            = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen   = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-activity-compose    = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose  = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

compose-bom                  = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui                   = { module = "androidx.compose.ui:ui" }
compose-ui-graphics          = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling           = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview   = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3            = { module = "androidx.compose.material3:material3" }
compose-material3-adaptive-nav = { module = "androidx.compose.material3:material3-adaptive-navigation-suite", version.ref = "adaptive" }

hilt-android                 = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler                = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "androidxHilt" }

room-runtime                 = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx                     = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler                = { module = "androidx.room:room-compiler", version.ref = "room" }

datastore-preferences        = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
datastore-core               = { module = "androidx.datastore:datastore-core", version.ref = "datastore" }
kotlinx-coroutines-android   = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

androidx-profileinstaller    = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
androidx-benchmark-macro     = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
androidx-test-ext-junit      = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-runner         = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-uiautomator         = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
junit                        = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test      = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library     = { id = "com.android.library", version.ref = "agp" }
android-test        = { id = "com.android.test", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm          = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt                = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
detekt              = { id = "dev.detekt", version.ref = "detekt" }
